<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat Realtime</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SCREEN: LOGIN -->
<div class="screen visible" id="screenLogin">
    <div class="login-box">
        <h1>Chat</h1>
        <p class="sub">Nhập tên và phòng để bắt đầu</p>
        <input type="text" id="inputName" placeholder="Tên của bạn" maxlength="24" autocomplete="off">
        <input type="text" id="inputRoom" placeholder="Phòng (mặc định: general)" maxlength="32" autocomplete="off">
        <button class="btn primary" id="btnJoin">Vào phòng</button>
        <div class="hint" id="loginHint"></div>
    </div>
</div>

<!-- SCREEN: CHAT -->
<div class="screen" id="screenChat">
    <header id="chatHeader">
        <button class="icon-btn" id="btnBack">←</button>
        <div class="header-info">
            <div class="room-name" id="roomName">#general</div>
            <div class="online" id="onlineCount">0 online</div>
        </div>
        <button class="icon-btn" id="btnUsers">👥</button>
    </header>

    <div id="messages"></div>

    <div id="typingBar"></div>

    <footer id="chatFooter">
        <input type="text" id="inputMsg" placeholder="Nhập tin nhắn..." maxlength="2000" autocomplete="off">
        <button class="icon-btn send" id="btnSend">➤</button>
    </footer>
</div>

<!-- DRAWER: USERS -->
<div id="drawer" class="drawer">
    <div class="drawer-head">
        <span>Thành viên</span>
        <button class="icon-btn" id="drawerClose">✕</button>
    </div>
    <div id="userList"></div>
</div>
<div id="overlay" class="overlay"></div>

<!-- TOAST -->
<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
